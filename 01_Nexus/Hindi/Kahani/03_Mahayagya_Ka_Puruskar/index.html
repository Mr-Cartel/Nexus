<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Interface</title>
    <style>
        :root { --core: #00ffcc; --core-glow: rgba(0, 255, 204, 0.3); --rain-filter: hue-rotate(0deg); }
        body { background-color: #0d0d0d; color: var(--core) !important; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 50px 20px; }
        .header-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        h1 { font-size: 3.5em; text-shadow: 0 0 20px var(--core) !important; margin: 0; text-transform: uppercase; letter-spacing: 4px; font-weight: bold; }
        .badge { background-color: #111; border: 3px solid var(--core) !important; border-radius: 12px; padding: 5px 20px; font-size: 2.8em; text-shadow: 0 0 15px var(--core) !important; box-shadow: 0 0 20px var(--core) !important; font-weight: bold; color: #fff; }
        .subtitle { color: #888; font-size: 1.2em; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        .search-container { margin: 0 auto 30px auto; max-width: 600px; display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .back-btn { padding: 12px 25px; background-color: #1a1a1c; color: #fff; text-decoration: none; border-radius: 8px; border: 1px solid #333; transition: 0.3s; font-weight: bold; letter-spacing: 1px; }
        .search-box { flex-grow: 1; padding: 12px 20px; font-size: 1.2em; background-color: #111; border: 2px solid var(--core) !important; border-radius: 8px; color: var(--core) !important; font-family: 'Courier New', Courier, monospace; box-shadow: 0 0 15px var(--core-glow) !important; outline: none; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 25px var(--core) !important; background-color: #1a1a1c; }
        .search-box::placeholder { color: #444; letter-spacing: 2px; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { position: relative; overflow: hidden; transform-style: preserve-3d; background-color: #161618; border: 1px solid #2a2a2c; border-radius: 12px; padding: 40px 20px; font-size: 1.4em; font-weight: bold; cursor: pointer; transition: all 0.3s ease-in-out; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; word-break: break-word; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), var(--core-glow) 0%, transparent 65%); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .card:hover::before { opacity: 1; }
        .card:hover { background-color: #1a1a1c; border-color: var(--core) !important; box-shadow: 0 0 20px var(--core-glow) !important; transform: translateY(-4px); color: var(--core) !important; }
        a { text-decoration: none; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 2.3em; } .badge { font-size: 1.8em; } }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; pointer-events: none; filter: var(--rain-filter); transition: filter 0.4s ease; }
        .mute-btn { position: fixed; top: 20px; right: 20px; background-color: #111; color: var(--core); border: 2px solid var(--core); border-radius: 8px; padding: 8px 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--core-glow); z-index: 100; transition: 0.3s; }
        .theme-btn { position: fixed; top: 20px; right: 185px; background-color: #111; color: var(--core); border: 2px solid var(--core); border-radius: 8px; padding: 8px 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--core-glow); z-index: 100; transition: 0.3s; }
        .back-btn:hover, .mute-btn:hover, .theme-btn:hover { background-color: var(--core) !important; color: #000 !important; box-shadow: 0 0 20px var(--core) !important; border-color: var(--core) !important; }
        .emp-ring { position: fixed; border: 2px solid var(--core); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; animation: empBlast 0.55s ease-out forwards; }
        @keyframes empBlast { 0% { width: 0px; height: 0px; opacity: 1; box-shadow: 0 0 20px var(--core); } 100% { width: 150px; height: 150px; opacity: 0; } }
        .intel-dock { max-width: 1200px; margin: 0 auto 35px auto; padding: 15px 20px; background: rgba(17, 17, 19, 0.85); border: 1px dashed var(--core); border-radius: 12px; display: none; }
        .intel-title { font-size: 0.95em; letter-spacing: 3px; color: var(--core); margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
        .intel-list { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .intel-chip { background: #161618; border: 1px solid var(--core); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 0.95em; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 10px var(--core-glow); transition: 0.25s; }
        .intel-chip:hover { background: var(--core); color: #000; transform: translateY(-3px); box-shadow: 0 0 20px var(--core); }
.holo-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.85); backdrop-filter: blur(6px); z-index: 9500; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }
        .holo-modal.active { display: flex; opacity: 1; }
        .holo-window { width: 94%; height: 90%; max-width: 1400px; background: #0b0b0d; border: 2px solid var(--core); border-radius: 12px; box-shadow: 0 0 40px var(--core-glow), 0 0 15px var(--core); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.92); transition: transform 0.25s ease; }
        .holo-modal.active .holo-window { transform: scale(1); }
        .holo-header { background: #121215; border-bottom: 2px solid var(--core); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .holo-title { color: var(--core); font-weight: bold; font-size: 1.05em; letter-spacing: 2px; text-shadow: 0 0 10px var(--core); text-transform: uppercase; word-break: break-all; text-align: left; }
        .holo-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
        .holo-btn { background: #1a1a1d; color: var(--core); border: 1px solid var(--core); padding: 7px 12px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 0.85em; cursor: pointer; text-decoration: none; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; }
        .holo-btn:hover { background: var(--core); color: #000; box-shadow: 0 0 15px var(--core); }
        .holo-close { border-color: #ff0033; color: #ff0033; }
        .holo-close:hover { background: #ff0033 !important; color: #fff !important; box-shadow: 0 0 15px #ff0033 !important; }
        .holo-frame { width: 100%; flex-grow: 1; border: none; background: #161618; }
.jarvis-orb { position: fixed; bottom: 25px; right: 25px; background: #111; color: var(--core); border: 2px solid var(--core); border-radius: 50px; padding: 12px 22px; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 1em; cursor: pointer; box-shadow: 0 0 20px var(--core-glow), inset 0 0 10px var(--core-glow); z-index: 9400; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .jarvis-orb:hover { background: var(--core); color: #000; box-shadow: 0 0 30px var(--core); transform: scale(1.05); }
        .jarvis-hud { position: fixed; bottom: 85px; right: 25px; width: 380px; max-width: calc(100vw - 50px); background: rgba(11, 11, 14, 0.96); border: 2px solid var(--core); border-radius: 12px; box-shadow: 0 0 35px var(--core-glow); z-index: 9400; display: none; flex-direction: column; overflow: hidden; backdrop-filter: blur(8px); text-align: left; }
        .jarvis-hud.open { display: flex; }
        .jarvis-top { background: #141418; border-bottom: 1px solid var(--core); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .jarvis-brand { font-weight: bold; font-size: 0.85em; letter-spacing: 2px; color: var(--core); text-shadow: 0 0 8px var(--core); }
        .jarvis-top-btns { display: flex; gap: 6px; }
        .jarvis-mini-btn { background: #1a1a1f; color: var(--core); border: 1px solid var(--core); border-radius: 5px; padding: 4px 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.75em; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .jarvis-mini-btn:hover { background: var(--core); color: #000; }
        .jarvis-log { padding: 14px; height: 170px; overflow-y: auto; font-size: 0.9em; line-height: 1.45; color: #e0e0e0; border-bottom: 1px solid #222; display: flex; flex-direction: column; gap: 10px; }
        .jarvis-msg-ai { color: var(--core); text-shadow: 0 0 6px var(--core-glow); }
        .jarvis-msg-user { color: #fff; opacity: 0.85; text-align: right; font-style: italic; }
        .jarvis-bar { display: flex; padding: 10px; gap: 8px; background: #0e0e11; align-items: center; }
        .jarvis-mic { background: #16161a; color: var(--core); border: 1px solid var(--core); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 1.1em; transition: 0.2s; }
        .jarvis-mic.listening { background: #ff0033; color: #fff; border-color: #ff0033; box-shadow: 0 0 20px #ff0033; animation: pulseMic 1s infinite; }
        @keyframes pulseMic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .jarvis-input { flex-grow: 1; background: #141417; border: 1px solid var(--core); color: var(--core); padding: 9px 12px; border-radius: 8px; font-family: 'Courier New', Courier, monospace; font-size: 0.9em; outline: none; }
        .jarvis-send { background: var(--core); color: #000; border: none; border-radius: 8px; padding: 9px 14px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .jarvis-send:hover { box-shadow: 0 0 15px var(--core); }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
<button id="jarvisOrb" class="jarvis-orb">&#129302; JARVIS AI</button>
    <div id="jarvisHud" class="jarvis-hud">
        <div class="jarvis-top">
            <span class="jarvis-brand">&#9889; JARVIS // AI</span>
            <div class="jarvis-top-btns">
                <button id="jarvisVoiceBtn" class="jarvis-mini-btn">&#128266; VOICE: ON</button>
                <button id="jarvisKeyBtn" class="jarvis-mini-btn">&#128273; CORE: FREE</button>
                <button id="jarvisCloseBtn" class="jarvis-mini-btn">&#10006;</button>
            </div>
        </div>
        <div id="jarvisLog" class="jarvis-log">
            <div class="jarvis-msg-ai">ONLINE. Type in the chat bar below or tap &#127897; to speak. Click &#128266; VOICE anytime for silent text-only mode.</div>
        </div>
        <div class="jarvis-bar">
            <button id="jarvisMicBtn" class="jarvis-mic" title="Optional Voice Input">&#127897;</button>
            <input type="text" id="jarvisInput" class="jarvis-input" placeholder="Type here to chat...">
            <button id="jarvisSendBtn" class="jarvis-send">&#9889;</button>
        </div>
    </div>
<div id="holoModal" class="holo-modal">
        <div class="holo-window">
            <div class="holo-header">
                <span id="holoTitle" class="holo-title">&#128196; HOLO-COCKPIT // READY</span>
                <div class="holo-controls">
                    <button id="holoSystem" class="holo-btn">&#128421; SYSTEM APP</button>
                    <a id="holoSave" href="#" download class="holo-btn">&#128190; SAVE</a>
                    <button id="holoPrint" class="holo-btn">&#128424; PRINT</button>
                    <button id="holoShare" class="holo-btn">&#128279; SHARE</button>
                    <a id="holoExternal" href="#" target="_blank" class="holo-btn">&#8599; FULL TAB</a>
                    <button id="holoClose" class="holo-btn holo-close">&#10006; CLOSE [ESC]</button>
                </div>
            </div>
            <iframe id="holoFrame" class="holo-frame" src=""></iframe>
        </div>
    </div>
    <button id="muteBtn" class="mute-btn">&#128266; AUDIO: ON</button>
    <button id="themeBtn" class="theme-btn">&#127912; CORE: CYAN</button>
    <div class="header-container">
        <h1>THE BINARY CARTEL</h1>
        <div class="badge">0</div>
        <div class="badge">1</div>
    </div>
    <div class="subtitle" id="section-title">STATUS: ACTIVE</div>
    
    <div class="search-container">
        <a href="../index.html" class="back-btn">&#11013; RETURN</a>
        <input type="text" id="cartelSearch" class="search-box" placeholder="> FILTER FOLDERS & FILES_">
    </div>
    <div id="recentIntelDock" class="intel-dock">
        <div class="intel-title">&#9889; RECENT INTEL // QUICK RESUME</div>
        <div id="recentIntelList" class="intel-list"></div>
    </div>
    <div class="dashboard" id="vaultGrid">
        <a href="HI/index.html"><div class="card">HI</div></a>
        <a href="hindi story ch 3.pdf" target="_blank"><div class="card">hindi story ch 3.pdf</div></a>

    </div>
    <script>
        // 1. SAFE FOLDER TITLE DETECTOR
        try {
            const secTitle = document.getElementById('section-title');
            if (secTitle) {
                let parts = window.location.pathname.split('/').filter(p => p !== "");
                let last = parts.length > 0 ? parts[parts.length - 1] : "";
                let target = (last.indexOf('.html') > -1 && parts.length > 1) ? parts[parts.length - 2] : last;
                if (!target) target = "MASTER VAULT";
                secTitle.innerText = "DIRECTORY: " + decodeURI(target).replace(/_/g, ' ') + " | STATUS: ONLINE";
            }
        } catch (err) {}

        // 2. ALWAYS-UNLOCKED WEB AUDIO SYNTH ENGINE
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;
        let isMuted = localStorage.getItem('cartelMute') === 'true';
        const muteBtn = document.getElementById('muteBtn');

        function unlockAudioEngine() {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        window.addEventListener('click', unlockAudioEngine);
        window.addEventListener('touchstart', unlockAudioEngine, { passive: true });
        window.addEventListener('keydown', unlockAudioEngine);

        function playSynth(startFreq, endFreq, duration, type) {
            if (isMuted || !audioCtx) return;
            const fireTone = function() {
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type || 'sine';
                    const now = audioCtx.currentTime;
                    osc.frequency.setValueAtTime(startFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(endFreq, now + duration);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + duration);
                } catch (err) {}
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(fireTone).catch(function() {});
            } else {
                fireTone();
            }
        }

        // 3. CHAMELEON CYBER-CORE THEME ENGINE
        const themes = [
            { name: 'CYAN', hex: '#00ffcc', glow: 'rgba(0, 255, 204, 0.3)', filter: 'hue-rotate(0deg)' },
            { name: 'SITH', hex: '#ff0033', glow: 'rgba(255, 0, 51, 0.3)', filter: 'hue-rotate(180deg) saturate(1.5)' },
            { name: 'GOLD', hex: '#ffcc00', glow: 'rgba(255, 204, 0, 0.3)', filter: 'hue-rotate(240deg) saturate(1.5)' },
            { name: 'PHANTOM', hex: '#bc13fe', glow: 'rgba(188, 19, 254, 0.3)', filter: 'hue-rotate(115deg) saturate(1.5)' }
        ];
        let currentTheme = parseInt(localStorage.getItem('cartelTheme')) || 0;
        const themeBtn = document.getElementById('themeBtn');

       function updateTopButtons() {
            const t = themes[currentTheme] || themes[0];
            document.documentElement.style.setProperty('--core', t.hex);
            document.documentElement.style.setProperty('--core-glow', t.glow);
            document.documentElement.style.setProperty('--rain-filter', t.filter);
            if (themeBtn) themeBtn.innerText = '\uD83C\uDFA8 CORE: ' + t.name;
            if (muteBtn) {
                muteBtn.innerText = isMuted ? '\uD83D\uDD07 AUDIO: MUTED' : '\uD83D\uDD0A AUDIO: ON';
                muteBtn.style.borderColor = isMuted ? '#ff0033' : t.hex;
                muteBtn.style.color = isMuted ? '#ff0033' : t.hex;
            }
        }
        updateTopButtons();

        if (muteBtn) {
            muteBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                isMuted = !isMuted;
                localStorage.setItem('cartelMute', isMuted);
                updateTopButtons();
                if (!isMuted) playSynth(880, 1320, 0.1, 'sine');
            });
        }
        if (themeBtn) {
            themeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                currentTheme = (currentTheme + 1) % themes.length;
                localStorage.setItem('cartelTheme', currentTheme);
                updateTopButtons();
                playSynth(400, 1600, 0.15, 'sawtooth');
            });
        }

        // 4. CARTEL SEARCH TERMINAL
        const searchBox = document.getElementById('cartelSearch');
        if (searchBox) {
            searchBox.addEventListener('keyup', function() {
                let filter = this.value.toUpperCase();
                let grid = document.getElementById('vaultGrid');
                if (!grid) return;
                let links = grid.getElementsByTagName('a');
                for (let i = 0; i < links.length; i++) {
                    let card = links[i].getElementsByClassName('card')[0];
                    if (card) {
                        let text = card.textContent || card.innerText;
                        links[i].style.display = text.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                    }
                }
            });
            searchBox.addEventListener('keydown', function() { playSynth(1600, 1200, 0.03, 'triangle'); });
        }

        // 5. MATRIX BINARY RAIN CANVAS
        const canvas = document.getElementById('matrixCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const drops = Array(Math.floor(canvas.width / 20)).fill(1);
            function drawMatrix() {
                ctx.fillStyle = 'rgba(13, 13, 13, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ffcc';
                ctx.font = '16px Courier New';
                drops.forEach(function(y, i) {
                    const text = Math.random() > 0.5 ? '1' : '0';
                    ctx.fillText(text, i * 20, y * 20);
                    if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }
            setInterval(drawMatrix, 50);
            window.addEventListener('resize', function() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        }

        // 6. 3D MAGNETIC CARDS, HOVER SYNTH & EMP SHOCKWAVE
        document.addEventListener('click', function(e) {
            const ring = document.createElement('div');
            ring.className = 'emp-ring';
            ring.style.left = e.clientX + 'px';
            ring.style.top = e.clientY + 'px';
            document.body.appendChild(ring);
            setTimeout(function() { ring.remove(); }, 550);
        });

        document.querySelectorAll('.card').forEach(function(card) {
            card.addEventListener('mouseenter', function() { playSynth(900, 1400, 0.05, 'sine'); });
            card.addEventListener('click', function() { playSynth(500, 1200, 0.12, 'triangle'); });
            card.addEventListener('mousemove', function(e) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const rotateX = ((y - rect.height / 2) / (rect.height / 2)) * -10;
                const rotateY = ((x - rect.width / 2) / (rect.width / 2)) * 10;
                card.style.transform = 'perspective(600px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.03)';
                card.style.setProperty('--mx', x + 'px');
                card.style.setProperty('--my', y + 'px');
            });
            card.addEventListener('mouseleave', function() { card.style.transform = ''; });
        });

        document.querySelectorAll('.back-btn').forEach(function(btn) {
            btn.addEventListener('mouseenter', function() { playSynth(700, 500, 0.05, 'sine'); });
            btn.addEventListener('click', function() { playSynth(800, 300, 0.15, 'sawtooth'); });
        });

        // 7. RECENT INTEL QUICK-LAUNCH DOCK
        function renderRecentIntel() {
            const dock = document.getElementById('recentIntelDock');
            const list = document.getElementById('recentIntelList');
            const saved = JSON.parse(localStorage.getItem('cartelRecentIntel') || '[]');
            if (!dock || !list || saved.length === 0) return;
            dock.style.display = 'block';
            list.innerHTML = '';
            saved.forEach(function(item) {
                const a = document.createElement('a');
                a.href = item.url;
                a.target = '_blank';
                a.className = 'intel-chip';
               a.innerText = '\uD83D\uDCC4 ' + item.name;
                a.addEventListener('mouseenter', function() { playSynth(950, 1450, 0.05, 'sine'); });
                list.appendChild(a);
            });
        }

        document.querySelectorAll('#vaultGrid a').forEach(function(link) {
            const rawHref = link.getAttribute('href') || '';
            if (rawHref.toLowerCase().endsWith('.pdf')) {
                link.addEventListener('click', function() {
                    const name = link.innerText.trim();
                    let saved = JSON.parse(localStorage.getItem('cartelRecentIntel') || '[]');
                    saved = saved.filter(function(i) { return i.name !== name; });
                    saved.unshift({ name: name, url: link.href });
                    if (saved.length > 3) saved = saved.slice(0, 3);
                    localStorage.setItem('cartelRecentIntel', JSON.stringify(saved));
                    renderRecentIntel();
                });
            }
        });
        renderRecentIntel();
// HOLO-COCKPIT IN-VAULT PDF THEATER (WITH SYSTEM APP, SAVE, PRINT & SHARE)
        const holoModal = document.getElementById('holoModal');
        const holoFrame = document.getElementById('holoFrame');
        const holoTitle = document.getElementById('holoTitle');
        const holoSystem = document.getElementById('holoSystem');
        const holoSave = document.getElementById('holoSave');
        const holoPrint = document.getElementById('holoPrint');
        const holoShare = document.getElementById('holoShare');
        const holoExternal = document.getElementById('holoExternal');
        const holoClose = document.getElementById('holoClose');

        function closeHoloCockpit() {
            if (!holoModal || !holoModal.classList.contains('active')) return;
            playSynth(700, 250, 0.15, 'sawtooth');
            holoModal.classList.remove('active');
            setTimeout(function() { holoFrame.src = ''; }, 250);
        }

        if (holoClose) holoClose.addEventListener('click', closeHoloCockpit);
        if (holoModal) {
            holoModal.addEventListener('click', function(e) {
                if (e.target === holoModal) closeHoloCockpit();
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeHoloCockpit();
        });

        if (holoSystem) {
            holoSystem.addEventListener('click', function() {
                playSynth(500, 1500, 0.14, 'sawtooth');
                const fileUrl = holoExternal.href;
                const origText = holoSystem.innerHTML;
                holoSystem.innerText = '\uD83D\uDE80 LAUNCHING APP...';
                setTimeout(function() { holoSystem.innerHTML = origText; }, 1800);

                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (isMobile) {
                    window.open(fileUrl, '_system');
                } else {
                    const sysLink = document.createElement('a');
                    sysLink.href = fileUrl;
                    sysLink.setAttribute('download', holoSave.getAttribute('download') || 'document.pdf');
                    document.body.appendChild(sysLink);
                    sysLink.click();
                    sysLink.remove();
                }
            });
        }

        if (holoSave) {
            holoSave.addEventListener('click', function() {
                playSynth(600, 1200, 0.1, 'sine');
            });
        }

        if (holoPrint) {
            holoPrint.addEventListener('click', function() {
                playSynth(800, 1400, 0.1, 'sine');
                try {
                    holoFrame.contentWindow.focus();
                    holoFrame.contentWindow.print();
                } catch (err) {
                    window.open(holoFrame.src, '_blank');
                }
            });
        }

        if (holoShare) {
            holoShare.addEventListener('click', function() {
                playSynth(900, 1600, 0.12, 'triangle');
                const shareUrl = holoExternal.href;
                const shareTitle = holoTitle.innerText;
                if (navigator.share && shareUrl.indexOf('http') === 0) {
                    navigator.share({ title: shareTitle, text: 'Binary Cartel Intel: ' + shareTitle, url: shareUrl }).catch(function() {});
                } else if (navigator.clipboard) {
                    navigator.clipboard.writeText(shareUrl).then(function() {
                        const orig = holoShare.innerHTML;
                        holoShare.innerText = '\u2714 LINK COPIED!';
                        setTimeout(function() { holoShare.innerHTML = orig; }, 1800);
                    });
                }
            });
        }

        document.addEventListener('click', function(e) {
            const link = e.target.closest('a');
            if (!link || link.id === 'holoExternal' || link.id === 'holoSave') return;
            const rawHref = link.getAttribute('href') || '';
            if (rawHref.toLowerCase().endsWith('.pdf') && holoModal && holoFrame) {
                e.preventDefault();
                playSynth(450, 1350, 0.16, 'triangle');
                const cleanName = link.innerText.replace(/[\uD83D\uDCC4\uD83D\uDCC2]/g, '').trim();
                holoTitle.innerText = '\uD83D\uDCC4 ' + cleanName;
                holoExternal.href = link.href;
                holoSave.href = link.href;
                holoSave.setAttribute('download', cleanName);
                holoFrame.src = link.href;
                holoModal.classList.add('active');
            }
        });
// HYBRID DUAL-CORE JARVIS AI (WITH SILENT CHAT BAR & VOICE MUTE TOGGLE)
        const jarvisOrb = document.getElementById('jarvisOrb');
        const jarvisHud = document.getElementById('jarvisHud');
        const jarvisCloseBtn = document.getElementById('jarvisCloseBtn');
        const jarvisVoiceBtn = document.getElementById('jarvisVoiceBtn');
        const jarvisKeyBtn = document.getElementById('jarvisKeyBtn');
        const jarvisLog = document.getElementById('jarvisLog');
        const jarvisMicBtn = document.getElementById('jarvisMicBtn');
        const jarvisInput = document.getElementById('jarvisInput');
        const jarvisSendBtn = document.getElementById('jarvisSendBtn');

        let jarvisVoiceMuted = localStorage.getItem('cartelJarvisMute') === 'true';

        function updateJarvisHeaderBtns() {
            if (jarvisKeyBtn) {
                const hasKey = !!localStorage.getItem('cartelGeminiKey');
                jarvisKeyBtn.innerText = hasKey ? '\uD83D\uDC8E CORE: GEMINI' : '\uD83D\uDD11 CORE: FREE';
            }
            if (jarvisVoiceBtn) {
                jarvisVoiceBtn.innerText = jarvisVoiceMuted ? '\uD83D\uDD07 VOICE: OFF' : '\uD83D\uDD0A VOICE: ON';
                jarvisVoiceBtn.style.borderColor = jarvisVoiceMuted ? '#ff0033' : '';
                jarvisVoiceBtn.style.color = jarvisVoiceMuted ? '#ff0033' : '';
            }
        }
        updateJarvisHeaderBtns();

        if (jarvisVoiceBtn) {
            jarvisVoiceBtn.addEventListener('click', function() {
                jarvisVoiceMuted = !jarvisVoiceMuted;
                localStorage.setItem('cartelJarvisMute', jarvisVoiceMuted);
                if (jarvisVoiceMuted && 'speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                updateJarvisHeaderBtns();
                playSynth(700, 1200, 0.08, 'sine');
            });
        }

        if (jarvisOrb && jarvisHud) {
            jarvisOrb.addEventListener('click', function() {
                playSynth(600, 1400, 0.12, 'triangle');
                jarvisHud.classList.toggle('open');
                if (jarvisHud.classList.contains('open') && jarvisInput) jarvisInput.focus();
            });
        }
        if (jarvisCloseBtn) {
            jarvisCloseBtn.addEventListener('click', function() {
                playSynth(700, 300, 0.1, 'sawtooth');
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                jarvisHud.classList.remove('open');
            });
        }
        if (jarvisKeyBtn) {
            jarvisKeyBtn.addEventListener('click', function() {
                const current = localStorage.getItem('cartelGeminiKey') || '';
                const inputKey = prompt('Optional: Paste a Google Gemini API Key for Gemini 2.5 Flash Turbo (or leave blank to keep using Free Zero-Key AI):', current);
                if (inputKey !== null) {
                    const clean = inputKey.trim();
                    if (clean) {
                        localStorage.setItem('cartelGeminiKey', clean);
                    } else {
                        localStorage.removeItem('cartelGeminiKey');
                    }
                    updateJarvisHeaderBtns();
                    playSynth(800, 1600, 0.12, 'sine');
                }
            });
        }

        function speakJarvisReply(text) {
            if (isMuted || jarvisVoiceMuted || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.resume();
                window.jarvisReplyUtterance = new SpeechSynthesisUtterance(text);
                window.jarvisReplyUtterance.lang = 'en-US';
                window.jarvisReplyUtterance.pitch = 0.75;
                window.jarvisReplyUtterance.rate = 1.05;
                window.speechSynthesis.speak(window.jarvisReplyUtterance);
            } catch (err) {}
        }

        function appendJarvisMsg(text, isUser) {
            if (!jarvisLog) return;
            const div = document.createElement('div');
            div.className = isUser ? 'jarvis-msg-user' : 'jarvis-msg-ai';
            div.innerText = (isUser ? '> ' : '\u26A1 ') + text;
            jarvisLog.appendChild(div);
            jarvisLog.scrollTop = jarvisLog.scrollHeight;
        }

        function getVaultContextList() {
            let items = [];
            if (window.CARTEL_INDEX && window.CARTEL_INDEX.length > 0) {
                items = window.CARTEL_INDEX.slice(0, 80).map(function(i) { return i.name + ' (' + i.sector + ')'; });
            } else {
                document.querySelectorAll('#vaultGrid a').forEach(function(a) {
                    items.push(a.innerText.trim());
                });
            }
            return items.join(', ');
        }

        function executeVaultFileOpen(targetQuery) {
            const q = targetQuery.trim().toUpperCase();
            if (!q) return false;
            const terms = q.split(/\s+/);

            const pageLinks = Array.from(document.querySelectorAll('#vaultGrid a'));
            for (let i = 0; i < pageLinks.length; i++) {
                const txt = pageLinks[i].innerText.toUpperCase();
                if (terms.every(function(t) { return txt.indexOf(t) > -1; })) {
                    pageLinks[i].click();
                    return true;
                }
            }

            if (window.CARTEL_INDEX) {
                const match = window.CARTEL_INDEX.find(function(item) {
                    const hay = (item.name + ' ' + item.sector).toUpperCase();
                    return terms.every(function(t) { return hay.indexOf(t) > -1; });
                });
                if (match && typeof holoModal !== 'undefined' && holoModal && holoFrame) {
                    holoTitle.innerText = '\uD83D\uDCC4 ' + match.name;
                    holoExternal.href = match.url;
                    if (typeof holoSave !== 'undefined' && holoSave) {
                        holoSave.href = match.url;
                        holoSave.setAttribute('download', match.name);
                    }
                    holoFrame.src = match.url;
                    holoModal.classList.add('active');
                    return true;
                } else if (match) {
                    window.open(match.url, '_blank');
                    return true;
                }
            }
            return false;
        }

        function processJarvisActions(rawReply) {
            let clean = rawReply;

            const themeMatch = clean.match(/\[THEME:(CYAN|SITH|GOLD|PHANTOM)\]/i);
            if (themeMatch) {
                const tName = themeMatch[1].toUpperCase();
                const idx = themes.findIndex(function(t) { return t.name === tName; });
                if (idx > -1) {
                    currentTheme = idx;
                    localStorage.setItem('cartelTheme', currentTheme);
                    updateTopButtons();
                }
            }

            if (/\[AUDIO:MUTE\]/i.test(clean)) {
                jarvisVoiceMuted = true;
                localStorage.setItem('cartelJarvisMute', true);
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                updateJarvisHeaderBtns();
            } else if (/\[AUDIO:UNMUTE\]/i.test(clean)) {
                jarvisVoiceMuted = false;
                localStorage.setItem('cartelJarvisMute', false);
                updateJarvisHeaderBtns();
            }

            if (/\[ACTION:BACK\]/i.test(clean)) {
                const backBtn = document.querySelector('.back-btn');
                if (backBtn) setTimeout(function() { backBtn.click(); }, 600);
            }

            const openMatch = clean.match(/\[OPEN:([^\]]+)\]/i);
            if (openMatch) {
                executeVaultFileOpen(openMatch[1]);
            }

            clean = clean.replace(/\[[A-Z]+:[^\]]+\]/gi, '').trim();
            return clean || 'Command executed.';
        }

        async function askJarvisBrain(userText) {
            const sysPrompt = 'You are JARVIS, the tactical cyberpunk AI mainframe of The Binary Cartel study vault. Keep responses concise (1 to 3 sentences), sharp, and helpful. ' +
                'If the user asks to change theme, include one tag: [THEME:CYAN], [THEME:SITH], [THEME:GOLD], or [THEME:PHANTOM]. ' +
                'If the user asks to mute or silence your voice, include [AUDIO:MUTE]. If they ask to unmute voice, include [AUDIO:UNMUTE]. ' +
                'If the user asks to go back/return, include [ACTION:BACK]. ' +
                'If the user asks to open a folder or PDF, include [OPEN:keyword] matching their request. ' +
                'Available vault items: ' + getVaultContextList();

            const gemKey = localStorage.getItem('cartelGeminiKey');
            if (gemKey) {
                try {
                    const gUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(gemKey);
                    const gRes = await fetch(gUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemInstruction: { parts: [{ text: sysPrompt }] },
                            contents: [{ parts: [{ text: userText }] }]
                        })
                    });
                    if (gRes.ok) {
                        const gData = await gRes.json();
                        const reply = gData.candidates && gData.candidates[0] && gData.candidates[0].content && gData.candidates[0].content.parts[0].text;
                        if (reply) return reply;
                    }
                } catch (err) {}
            }

            const pRes = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: [
                        { role: 'system', content: sysPrompt },
                        { role: 'user', content: userText }
                    ],
                    model: 'openai'
                })
            });
            return await pRes.text();
        }

        async function handleJarvisCommand(rawText) {
            const text = (rawText || '').trim();
            if (!text) return;
            if (jarvisInput) jarvisInput.value = '';
            appendJarvisMsg(text, true);
            playSynth(500, 1200, 0.08, 'sine');

            try {
                const rawReply = await askJarvisBrain(text);
                const cleanReply = processJarvisActions(rawReply);
                appendJarvisMsg(cleanReply, false);
                speakJarvisReply(cleanReply);
            } catch (err) {
                appendJarvisMsg('Mainframe link interrupted. Try again.', false);
            }
        }

        if (jarvisSendBtn) {
            jarvisSendBtn.addEventListener('click', function() {
                handleJarvisCommand(jarvisInput.value);
            });
        }
        if (jarvisInput) {
            jarvisInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleJarvisCommand(jarvisInput.value);
            });
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRec && jarvisMicBtn) {
            const recognition = new SpeechRec();
            recognition.lang = 'en-US';
            recognition.interimResults = false;

            jarvisMicBtn.addEventListener('click', function() {
                try {
                    playSynth(800, 1500, 0.1, 'triangle');
                    jarvisMicBtn.classList.add('listening');
                    recognition.start();
                } catch (err) {}
            });
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                jarvisMicBtn.classList.remove('listening');
                handleJarvisCommand(transcript);
            };
            recognition.onerror = function() {
                jarvisMicBtn.classList.remove('listening');
            };
            recognition.onend = function() {
                jarvisMicBtn.classList.remove('listening');
            };
        }
    </script>
</body>
</html>
