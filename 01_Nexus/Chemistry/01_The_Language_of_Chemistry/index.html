<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Interface</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 50px 20px; }
        .header-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        h1 { font-size: 3.5em; text-shadow: 0 0 20px #00ffcc; margin: 0; text-transform: uppercase; letter-spacing: 4px; font-weight: bold;}
        .badge { background-color: #111; border: 3px solid #00ffcc; border-radius: 12px; padding: 5px 20px; font-size: 2.8em; text-shadow: 0 0 15px #00ffcc; box-shadow: 0 0 20px #00ffcc; font-weight: bold; color: #fff;}
        .subtitle { color: #888; font-size: 1.2em; letter-spacing: 3px; margin-bottom: 20px; text-transform: uppercase; }
        .search-container { margin: 0 auto 30px auto; max-width: 600px; display: flex; gap: 15px; align-items: center; justify-content: center;}
        .back-btn { padding: 12px 25px; background-color: #1a1a1c; color: #fff; text-decoration: none; border-radius: 8px; border: 1px solid #333; transition: 0.3s; font-weight: bold; letter-spacing: 1px; }
        .back-btn:hover { background-color: #00ffcc; color: #000; box-shadow: 0 0 15px #00ffcc; }
        .search-box { flex-grow: 1; padding: 12px 20px; font-size: 1.2em; background-color: #111; border: 2px solid #00ffcc; border-radius: 8px; color: #00ffcc; font-family: 'Courier New', Courier, monospace; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); outline: none; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 20px #00ffcc; background-color: #1a1a1c; }
        .search-box::placeholder { color: #444; letter-spacing: 2px; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #161618; border: 1px solid #2a2a2c; border-radius: 12px; padding: 40px 20px; font-size: 1.4em; font-weight: bold; cursor: pointer; transition: all 0.3s ease-in-out; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; word-break: break-word; }
        .card:hover { background-color: #1a1a1c; border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); transform: translateY(-4px); color: #00ffcc; }
        a { text-decoration: none; }
#matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; pointer-events: none; }
.mute-btn { position: fixed; top: 20px; right: 20px; background-color: #111; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 8px; padding: 8px 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); z-index: 100; transition: 0.3s; }
        .mute-btn:hover { background-color: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; }
    </style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<button id="muteBtn" class="mute-btn">🔊 AUDIO: ON</button>
    <div class="header-container">
        <h1>THE BINARY CARTEL</h1>
        <div class="badge">0</div>
        <div class="badge">1</div>
    </div>
    <div class="subtitle" id="section-title">STATUS: ACTIVE</div>
    
    <div class="search-container">
        <a href="../index.html" class="back-btn">⬅ RETURN</a>
        <input type="text" id="cartelSearch" class="search-box" placeholder="> FILTER FOLDERS & FILES_">
    </div>
    
    <div class="dashboard" id="vaultGrid">
        <a href="HI/index.html"><div class="card">HI</div></a>
        <a href="chem ch 1.pdf" target="_blank"><div class="card">chem ch 1.pdf</div></a>

    </div>
    <script>
        let path = window.location.pathname;
        let parts = path.split('/').filter(p => p !== "");
        let target = parts[parts.length - 1].includes('.html') ? parts[parts.length - 2] : parts[parts.length - 1];
        if (!target || target === "") target = "MASTER VAULT";
        let folder = decodeURI(target).replace(/_/g, ' ');
        document.getElementById('section-title').innerText = "DIRECTORY: " + folder + " | STATUS: ONLINE";

        document.getElementById('cartelSearch').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let grid = document.getElementById('vaultGrid');
            let links = grid.getElementsByTagName('a');
            for (let i = 0; i < links.length; i++) {
                let card = links[i].getElementsByClassName('card')[0];
                let text = card.textContent || card.innerText;
                if (text.toUpperCase().indexOf(filter) > -1) {
                    links[i].style.display = "";
                } else {
                    links[i].style.display = "none";
                }
            }
        });
const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 13, 13, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = '16px Courier New';
            drops.forEach((y, i) => {
                const text = Math.random() > 0.5 ? '1' : '0';
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = localStorage.getItem('cartelMute') === 'true';
        const muteBtn = document.getElementById('muteBtn');
        function updateMuteUI() {
            muteBtn.innerText = isMuted ? '🔇 AUDIO: MUTED' : '🔊 AUDIO: ON';
            muteBtn.style.borderColor = isMuted ? '#ff0033' : '#00ffcc';
            muteBtn.style.color = isMuted ? '#ff0033' : '#00ffcc';
        }
        updateMuteUI();
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('cartelMute', isMuted);
            updateMuteUI();
            if (!isMuted) playSynth(880, 1320, 0.08, 'sine');
        });
        function playSynth(startFreq, endFreq, duration, type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', () => playSynth(900, 1400, 0.04, 'sine'));
            card.addEventListener('click', () => playSynth(500, 1200, 0.12, 'triangle'));
        });
        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => playSynth(700, 500, 0.04, 'sine'));
            btn.addEventListener('click', () => playSynth(800, 300, 0.15, 'sawtooth'));
        });
        document.getElementById('cartelSearch').addEventListener('keydown', () => {
            playSynth(1600, 1200, 0.025, 'triangle');
        });
    </script>
</body>
</html>
