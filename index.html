<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Binary Cartel</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 50px 20px; }
        .header-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        h1 { font-size: 4em; text-shadow: 0 0 20px #00ffcc; margin: 0; text-transform: uppercase; letter-spacing: 4px; font-weight: bold;}
        .badge { background-color: #111; border: 3px solid #00ffcc; border-radius: 12px; padding: 10px 25px; font-size: 3.5em; text-shadow: 0 0 15px #00ffcc; box-shadow: 0 0 20px #00ffcc; font-weight: bold; color: #fff;}
        .subtitle { color: #888; font-size: 1.2em; letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; }
        .search-container { margin: 0 auto 50px auto; max-width: 600px; }
        .search-box { width: 100%; padding: 15px 20px; font-size: 1.2em; background-color: #111; border: 2px solid #00ffcc; border-radius: 8px; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); outline: none; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 30px #00ffcc; background-color: #1a1a1c; }
        .search-box::placeholder { color: #444; letter-spacing: 2px; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #161618; border: 1px solid #2a2a2c; border-radius: 12px; padding: 40px 20px; font-size: 1.4em; font-weight: bold; cursor: pointer; transition: all 0.3s ease-in-out; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; gap: 15px;}
        .card:hover { background-color: #1a1a1c; border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); transform: translateY(-4px); color: #00ffcc; }
        a { text-decoration: none; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 2.5em; } .badge { font-size: 2em; } }
#matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; pointer-events: none; }
.mute-btn { position: fixed; top: 20px; right: 20px; background-color: #111; color: #00ffcc; border: 2px solid #00ffcc; border-radius: 8px; padding: 8px 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); z-index: 100; transition: 0.3s; }
        .mute-btn:hover { background-color: #00ffcc; color: #000; box-shadow: 0 0 20px #00ffcc; }
:root { --core: #00ffcc; --core-glow: rgba(0, 255, 204, 0.3); --rain-filter: hue-rotate(0deg); }
        body { color: var(--core) !important; }
        h1 { text-shadow: 0 0 20px var(--core) !important; }
        .badge { border-color: var(--core) !important; text-shadow: 0 0 15px var(--core) !important; box-shadow: 0 0 20px var(--core) !important; }
        .search-box { border-color: var(--core) !important; color: var(--core) !important; box-shadow: 0 0 15px var(--core-glow) !important; }
        .search-box:focus { box-shadow: 0 0 25px var(--core) !important; }
        .card:hover { border-color: var(--core) !important; box-shadow: 0 0 20px var(--core-glow) !important; color: var(--core) !important; }
        .back-btn:hover, .mute-btn:hover, .theme-btn:hover { background-color: var(--core) !important; color: #000 !important; box-shadow: 0 0 20px var(--core) !important; border-color: var(--core) !important; }
        #matrixCanvas { filter: var(--rain-filter); transition: filter 0.4s ease; }
        .theme-btn { position: fixed; top: 20px; right: 185px; background-color: #111; color: var(--core); border: 2px solid var(--core); border-radius: 8px; padding: 8px 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--core-glow); z-index: 100; transition: 0.3s; }
#bootScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: all; }
        .blast-door-top, .blast-door-bottom { position: fixed; left: 0; width: 100%; height: 50%; background: repeating-linear-gradient(45deg, #070708, #070708 15px, #0d0d0f 15px, #0d0d0f 30px); z-index: 9998; transition: transform 0.85s cubic-bezier(0.77, 0, 0.175, 1); }
        .blast-door-top { top: 0; border-bottom: 3px solid var(--core, #00ffcc); box-shadow: 0 5px 30px var(--core, #00ffcc); }
        .blast-door-bottom { bottom: 0; border-top: 3px solid var(--core, #00ffcc); box-shadow: 0 -5px 30px var(--core, #00ffcc); }
        .boot-terminal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background-color: #0b0b0c; border: 2px solid var(--core, #00ffcc); padding: 18px 35px; border-radius: 8px; color: var(--core, #00ffcc); font-size: 1.3em; font-weight: bold; letter-spacing: 3px; box-shadow: 0 0 35px var(--core, #00ffcc); text-shadow: 0 0 10px var(--core, #00ffcc); transition: opacity 0.25s ease, transform 0.25s ease; }
        #bootScreen.doors-open { pointer-events: none; }
        #bootScreen.doors-open .blast-door-top { transform: translateY(-105%); }
        #bootScreen.doors-open .blast-door-bottom { transform: translateY(105%); }
        #bootScreen.doors-open .boot-terminal { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
.emp-ring { position: fixed; border: 2px solid var(--core, #00ffcc); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 9999; animation: empBlast 0.55s ease-out forwards; }
        @keyframes empBlast { 0% { width: 0px; height: 0px; opacity: 1; box-shadow: 0 0 20px var(--core, #00ffcc); } 100% { width: 150px; height: 150px; opacity: 0; } }
        .card { position: relative; overflow: hidden; transform-style: preserve-3d; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), var(--core-glow, rgba(0, 255, 204, 0.25)) 0%, transparent 65%); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        .card:hover::before { opacity: 1; }
        .intel-dock { max-width: 1200px; margin: 0 auto 35px auto; padding: 15px 20px; background: rgba(17, 17, 19, 0.85); border: 1px dashed var(--core, #00ffcc); border-radius: 12px; display: none; }
        .intel-title { font-size: 0.95em; letter-spacing: 3px; color: var(--core, #00ffcc); margin-bottom: 12px; font-weight: bold; text-transform: uppercase; }
        .intel-list { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .intel-chip { background: #161618; border: 1px solid var(--core, #00ffcc); color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 0.95em; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 10px var(--core-glow, rgba(0, 255, 204, 0.2)); transition: 0.25s; }
        .intel-chip:hover { background: var(--core, #00ffcc); color: #000; transform: translateY(-3px); box-shadow: 0 0 20px var(--core, #00ffcc); }
    </style>
</head>
<body>
<canvas id="matrixCanvas"></canvas>
<div id="bootScreen">
        <div class="blast-door-top"></div>
        <div class="blast-door-bottom"></div>
        <div class="boot-terminal" id="bootText">🔒 DECRYPTING BINARY CARTEL...</div>
    </div>
<button id="muteBtn" class="mute-btn">🔊 AUDIO: ON</button>
<button id="themeBtn" class="theme-btn">🎨 CORE: CYAN</button>
    <div class="header-container">
        <h1>THE BINARY CARTEL</h1>
        <div class="badge">0</div>
        <div class="badge">1</div>
    </div>
    <div class="subtitle">ARCHITECTURE: LOCKED | STATUS: ONLINE</div>
    
    <div class="search-container">
        <input type="text" id="cartelSearch" class="search-box" placeholder="> INITIATE SEARCH TERMINAL_">
    </div>
   <div id="recentIntelDock" class="intel-dock">
        <div class="intel-title">⚡ RECENT INTEL // QUICK RESUME</div>
        <div id="recentIntelList" class="intel-list"></div>
    </div> 
    <div class="dashboard" id="vaultGrid">
        <a href="01_Nexus/index.html"><div class="card">🏆 Sec 1: Nexus</div></a>
        <a href="02_The_Cartel/index.html"><div class="card">⚔️ Sec 2: The Cartel</div></a>
        <a href="03_PYQs/index.html"><div class="card">⏳ Sec 3: PYQs</div></a>
        <a href="04_Short_Notes/index.html"><div class="card">⚡ Sec 4: Short Notes</div></a>
        <a href="05_Cached/index.html"><div class="card">🗑️ Sec 5: Cached</div></a>
        <a href="06_Syllabus/index.html"><div class="card">📖 Sec 6: Syllabus</div></a>
        <a href="07_Specimens/index.html"><div class="card">🎯 Sec 7: Specimens</div></a>
        <a href="08_Maintenance/index.html"><div class="card">🛠️ Sec 8: Maintenance</div></a>
    </div>

    <script>
        document.getElementById('cartelSearch').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let grid = document.getElementById('vaultGrid');
            let links = grid.getElementsByTagName('a');
            for (let i = 0; i < links.length; i++) {
                let card = links[i].getElementsByClassName('card')[0];
                let text = card.textContent || card.innerText;
                if (text.toUpperCase().indexOf(filter) > -1) {
                    links[i].style.display = "";
                } else {
                    links[i].style.display = "none";
                }
            }
        });
const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const drops = Array(Math.floor(canvas.width / 20)).fill(1);
        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 13, 13, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = '16px Courier New';
            drops.forEach((y, i) => {
                const text = Math.random() > 0.5 ? '1' : '0';
                ctx.fillText(text, i * 20, y * 20);
                if (y * 20 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(drawMatrix, 50);
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = localStorage.getItem('cartelMute') === 'true';
        const muteBtn = document.getElementById('muteBtn');
        function updateMuteUI() {
            muteBtn.innerText = isMuted ? '🔇 AUDIO: MUTED' : '🔊 AUDIO: ON';
            muteBtn.style.borderColor = isMuted ? '#ff0033' : '#00ffcc';
            muteBtn.style.color = isMuted ? '#ff0033' : '#00ffcc';
        }
        updateMuteUI();
        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            localStorage.setItem('cartelMute', isMuted);
            updateMuteUI();
            if (!isMuted) playSynth(880, 1320, 0.08, 'sine');
        });
        function playSynth(startFreq, endFreq, duration, type) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mouseenter', () => playSynth(900, 1400, 0.04, 'sine'));
            card.addEventListener('click', () => playSynth(500, 1200, 0.12, 'triangle'));
        });
        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => playSynth(700, 500, 0.04, 'sine'));
            btn.addEventListener('click', () => playSynth(800, 300, 0.15, 'sawtooth'));
        });
        document.getElementById('cartelSearch').addEventListener('keydown', () => {
            playSynth(1600, 1200, 0.025, 'triangle');
        });
const themes = [
            { name: 'CYAN', hex: '#00ffcc', glow: 'rgba(0, 255, 204, 0.3)', filter: 'hue-rotate(0deg)' },
            { name: 'SITH', hex: '#ff0033', glow: 'rgba(255, 0, 51, 0.3)', filter: 'hue-rotate(180deg) saturate(1.5)' },
            { name: 'GOLD', hex: '#ffcc00', glow: 'rgba(255, 204, 0, 0.3)', filter: 'hue-rotate(240deg) saturate(1.5)' },
            { name: 'PHANTOM', hex: '#bc13fe', glow: 'rgba(188, 19, 254, 0.3)', filter: 'hue-rotate(115deg) saturate(1.5)' }
        ];
        let currentTheme = parseInt(localStorage.getItem('cartelTheme')) || 0;
        const themeBtn = document.getElementById('themeBtn');
        function applyTheme(index) {
            const t = themes[index];
            document.documentElement.style.setProperty('--core', t.hex);
            document.documentElement.style.setProperty('--core-glow', t.glow);
            document.documentElement.style.setProperty('--rain-filter', t.filter);
            themeBtn.innerText = '🎨 CORE: ' + t.name;
            if (!isMuted) {
                muteBtn.style.borderColor = t.hex;
                muteBtn.style.color = t.hex;
            }
        }
        applyTheme(currentTheme);
        themeBtn.addEventListener('click', () => {
            currentTheme = (currentTheme + 1) % themes.length;
            localStorage.setItem('cartelTheme', currentTheme);
            applyTheme(currentTheme);
            playSynth(400, 1600, 0.15, 'sawtooth');
        });
        muteBtn.addEventListener('click', () => applyTheme(currentTheme));
const bootScreen = document.getElementById('bootScreen');
        const bootText = document.getElementById('bootText');
        if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); }

        function speakJarvis() {
            if (isMuted || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance("Identity verified. Welcome to the Binary Cartel.");
            const voices = window.speechSynthesis.getVoices();
            const preferred = voices.find(v => v.name.includes('David') || v.name.includes('Google UK English Male') || v.name.includes('Mark'));
            if (preferred) msg.voice = preferred;
            msg.pitch = 0.75;
            msg.rate = 1.05;
            msg.volume = 1;
            window.speechSynthesis.speak(msg);
        }

        function runBootSequence() {
            bootScreen.style.display = 'block';
            void bootScreen.offsetWidth;
            bootScreen.classList.remove('doors-open');
            bootText.innerText = '🔒 DECRYPTING BINARY CARTEL...';
            playSynth(300, 600, 0.08, 'sawtooth');
            setTimeout(() => {
                bootText.innerText = '🧬 BIOMETRICS VERIFIED...';
                playSynth(600, 900, 0.08, 'sawtooth');
            }, 450);
            setTimeout(() => {
                bootText.innerText = '🔓 ACCESS GRANTED';
                playSynth(900, 1500, 0.12, 'triangle');
            }, 900);
            setTimeout(() => {
                bootScreen.classList.add('doors-open');
                playSynth(180, 40, 0.55, 'sawtooth');
                speakJarvis();
            }, 1350);
        }

        if (!sessionStorage.getItem('cartelBooted')) {
            sessionStorage.setItem('cartelBooted', 'true');
            window.addEventListener('load', runBootSequence);
        } else {
            bootScreen.style.display = 'none';
        }
        document.querySelectorAll('.badge').forEach(b => {
            b.style.cursor = 'pointer';
            b.addEventListener('click', runBootSequence);
        });
document.addEventListener('click', function(e) {
            const ring = document.createElement('div');
            ring.className = 'emp-ring';
            ring.style.left = e.clientX + 'px';
            ring.style.top = e.clientY + 'px';
            document.body.appendChild(ring);
            setTimeout(() => ring.remove(), 550);
        });

        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('mousemove', function(e) {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -10;
                const rotateY = ((x - centerX) / centerX) * 10;
                card.style.transform = 'perspective(600px) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg) scale(1.03)';
                card.style.setProperty('--mx', x + 'px');
                card.style.setProperty('--my', y + 'px');
            });
            card.addEventListener('mouseleave', function() {
                card.style.transform = '';
            });
        });

        function renderRecentIntel() {
            const dock = document.getElementById('recentIntelDock');
            const list = document.getElementById('recentIntelList');
            const saved = JSON.parse(localStorage.getItem('cartelRecentIntel') || '[]');
            if (!dock || !list || saved.length === 0) return;
            dock.style.display = 'block';
            list.innerHTML = '';
            saved.forEach(item => {
                const a = document.createElement('a');
                a.href = item.url;
                a.target = '_blank';
                a.className = 'intel-chip';
                a.innerText = '📄 ' + item.name;
                a.addEventListener('mouseenter', () => playSynth(950, 1450, 0.04, 'sine'));
                list.appendChild(a);
            });
        }

        document.querySelectorAll('#vaultGrid a').forEach(link => {
            const rawHref = link.getAttribute('href') || '';
            if (rawHref.toLowerCase().endsWith('.pdf')) {
                link.addEventListener('click', function() {
                    const name = link.innerText.trim();
                    let saved = JSON.parse(localStorage.getItem('cartelRecentIntel') || '[]');
                    saved = saved.filter(i => i.name !== name);
                    saved.unshift({ name: name, url: link.href });
                    if (saved.length > 3) saved = saved.slice(0, 3);
                    localStorage.setItem('cartelRecentIntel', JSON.stringify(saved));
                    renderRecentIntel();
                });
            }
        });
        renderRecentIntel();
    </script>
</body>
</html>
