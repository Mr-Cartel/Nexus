<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Binary Cartel</title>
    <style>
        body { background-color: #0d0d0d; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; margin: 0; padding: 50px 20px; }
        .header-container { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; }
        h1 { font-size: 4em; text-shadow: 0 0 20px #00ffcc; margin: 0; text-transform: uppercase; letter-spacing: 4px; font-weight: bold;}
        .badge { background-color: #111; border: 3px solid #00ffcc; border-radius: 12px; padding: 10px 25px; font-size: 3.5em; text-shadow: 0 0 15px #00ffcc; box-shadow: 0 0 20px #00ffcc; font-weight: bold; color: #fff;}
        .subtitle { color: #888; font-size: 1.2em; letter-spacing: 3px; margin-bottom: 30px; text-transform: uppercase; }
        .search-container { margin: 0 auto 50px auto; max-width: 600px; }
        .search-box { width: 100%; padding: 15px 20px; font-size: 1.2em; background-color: #111; border: 2px solid #00ffcc; border-radius: 8px; color: #00ffcc; font-family: 'Courier New', Courier, monospace; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 204, 0.2); outline: none; transition: 0.3s; }
        .search-box:focus { box-shadow: 0 0 30px #00ffcc; background-color: #1a1a1c; }
        .search-box::placeholder { color: #444; letter-spacing: 2px; }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #161618; border: 1px solid #2a2a2c; border-radius: 12px; padding: 40px 20px; font-size: 1.4em; font-weight: bold; cursor: pointer; transition: all 0.3s ease-in-out; color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; gap: 15px;}
        .card:hover { background-color: #1a1a1c; border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.3); transform: translateY(-4px); color: #00ffcc; }
        a { text-decoration: none; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 2.5em; } .badge { font-size: 2em; } }
    </style>
</head>
<body>
    <div class="header-container">
        <h1>THE BINARY CARTEL</h1>
        <div class="badge">0</div>
        <div class="badge">1</div>
    </div>
    <div class="subtitle">ARCHITECTURE: LOCKED | STATUS: ONLINE</div>
    
    <div class="search-container">
        <input type="text" id="cartelSearch" class="search-box" placeholder="> INITIATE SEARCH TERMINAL_">
    </div>
    
    <div class="dashboard" id="vaultGrid">
        <a href="01_Nexus/index.html"><div class="card">🏆 Sec 1: Nexus</div></a>
        <a href="02_the_cartel/index.html"><div class="card">⚔️ Sec 2: The Cartel</div></a>
        <a href="03_pyqs/index.html"><div class="card">⏳ Sec 3: PYQs</div></a>
        <a href="04_short_notes/index.html"><div class="card">⚡ Sec 4: Short Notes</div></a>
        <a href="05_Cached/index.html"><div class="card">🗑️ Sec 5: Cached</div></a>
        <a href="06_Syllabus/index.html"><div class="card">📖 Sec 6: Syllabus</div></a>
        <a href="07_Specimens/index.html"><div class="card">🎯 Sec 7: Specimens</div></a>
        <a href="08_Maintenance/index.html"><div class="card">🛠️ Sec 8: Maintenance</div></a>
    </div>

    <script>
        document.getElementById('cartelSearch').addEventListener('keyup', function() {
            let filter = this.value.toUpperCase();
            let grid = document.getElementById('vaultGrid');
            let links = grid.getElementsByTagName('a');
            for (let i = 0; i < links.length; i++) {
                let card = links[i].getElementsByClassName('card')[0];
                let text = card.textContent || card.innerText;
                if (text.toUpperCase().indexOf(filter) > -1) {
                    links[i].style.display = "";
                } else {
                    links[i].style.display = "none";
                }
            }
        });
    </script>
</body>
</html>
